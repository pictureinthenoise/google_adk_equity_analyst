<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google ADK Equity Analyst</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="d-flex flex-column vh-100 bg-light">
        <header class="bg-white shadow-sm flex-shrink-0 google-border-top">
            <div class="container py-3 d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0 fw-bold text-dark">
                    <span class="text-google-blue">G</span>oogle ADK Equity Analyst
                </h1>
                <button id="downloadBtn" class="btn btn-outline-secondary btn-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-1" viewBox="0 0 16 16">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                        <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                    </svg>
                    Download Chat
                </button>
            </div>
        </header>
        <main class="flex-grow-1 overflow-auto py-4" id="chatContainer">
            <div class="container d-flex flex-column" id="chatWindow">
                <div class="chat-bubble agent-bubble align-self-start mb-3 shadow-sm">
                    Hello! I am your Google ADK Equity Analyst. What company would you like me to analyze today?
                </div>
            </div>
        </main>
        <section class="flex-shrink-0 bg-white border-top py-3">
            <div class="container">
                <form id="chatForm" class="d-flex gap-2">
                    <input type="text" id="userInput" class="form-control form-control-lg" placeholder="Type your request here (e.g., Analyze AAPL)..." required autocomplete="off" disabled>
                    <button type="submit" id="sendBtn" class="btn btn-google-blue btn-lg px-4" disabled>Send</button>
                </form>
            </div>
        </section>
        <footer class="flex-shrink-0 bg-dark text-center py-2 text-white-50 small">
            <div class="container">
                Built by <span class="text-white">pictureinthenoise</span> / Powered by Google Gemini and Anthropic Claude
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
